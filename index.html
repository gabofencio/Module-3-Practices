<!DOCTYPE html>
<html lang="en">

<head>

    <title>ChatBox</title>
</head>

<body>
    <div id="chat-box">
        <h1>Caja de comments</h1>

        </form>
    </div>
    <div id="newCommentParagraph"> </div>

    <script src="intro-al-dom.js"></script>
</body>

</html>
