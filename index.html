<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Libros</title>
    <link rel="stylesheet" href="CSS/stylesheet.css" />
</head>

<body>
    <div    class="chat-box">
    <div id="commentSection">
        <h1>Comenta acerca del nuevo libro de George R.R. Martin: Canción de Hielo y Fuego</h1>

            <input type="text" id="name-input" placeholder="Tu nombre" required>
            <textarea id="comment-input" placeholder="Tu comentario" required></textarea>
            <button type="submit" id="send-button">Enviar</button>
        </form>
    </div>
    <div id="newCommentParagraph"> </div>
</div>
    <script src="comment-box-project.js"></script>
</body>

</html>
